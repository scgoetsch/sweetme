```
    <button id="hideToggle" onclick="toggleControls()">Hide Controls</button>
    
    <div id="controls">
        <div style="margin-bottom: 10px;">
            <button onclick="startAnimation()">Start Animation</button>
            <button onclick="resetAnimation()">Reset</button>
        </div>
        <div style="margin-bottom: 10px;">
            <button onclick="toggleTransparency()">Earth</button>
            <button onclick="toggleSun()">Sun</button>
            <button onclick="toggleMoon()">Moon</button>
        </div>
        <div class="control-row">
            <label>Speed:</label>
            <input type="range" id="speedControl" min="0.01" max="20" value="1" step="0.01" onchange="updateSpeed()">
        </div>
        <div class="control-row">
            <label>Zoom:</label>
            <input type="range" id="zoomControl" min="5" max="50" value="22" step="1" onchange="updateZoom()">
        </div>
        <div class="control-row">
            <label>Year:</label>
            <input type="number" id="yearInput" min="1900" max="2100" value="2025" onchange="updateYear()">
        </div>
    </div>
    
    <div id="info">
        <div class="info-row">
            <span class="info-label">Phase:</span>
            <span class="info-value" id="phase">Initial View</span>
        </div>
        <div class="info-row">
            <span class="info-label">Earth Rotation:</span>
            <span class="info-value" id="rotation">0°</span>
        </div>
        <div class="info-row">
            <span class="info-label">Orbital Position:</span>
            <span class="info-value" id="orbital">Summer Solstice</span>
        </div>

<script>
    // Global variables
    let scene, camera, renderer, earth, sun, dallasPoint, moon, traceGeometry, traceLine, moonTraceGeometry, moonTraceLine;
    let animationPhase = 0;
    let animationSpeed = 1;
    let isAnimating = false;
    let earthRotation = 0;
    let orbitalRotation = 0;
    let moonRotation = 0;
    let tracePoints = [];
    let moonTracePoints = [];
    let earthTransparent = false;
    let sunVisible = false;
    let moonVisible = true;
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let cameraRotation = { x: 0.35, y: 0 };
    let cameraDistance = 22;
    let touches = [];
    let lastTouchDistance = 0;
    let selectedYear = 2025;
    let controlsVisible = true;

    // Dallas coordinates (latitude: 32.7767°, longitude: -96.7970°)
    const dallasLat = 32.7767 * Math.PI / 180;
    const dallasLon = -96.7970 * Math.PI / 180;
    const earthTilt = 23.5 * Math.PI / 180; // Earth's axial tilt in radians

    function init() {
        try {
            // Scene setup with proper sizing
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            
            // Force proper canvas sizing
            const container = document.getElementById('container');
            const containerRect = container.getBoundingClientRect();
            renderer.setSize(containerRect.width, containerRect.height, false);
            renderer.domElement.style.width = '100%';
            renderer.domElement.style.height = '100%';
            renderer.setClearColor(0x000011);
            container.appendChild(renderer.domElement);

            // Create Sun
            const sunGeometry = new THREE.SphereGeometry(2, 32, 32);
            const sunMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffff00,
                emissive: 0xffaa00,
                emissiveIntensity: 0.3
            });
            sun = new THREE.Mesh(sunGeometry, sunMaterial);
            sun.visible = sunVisible;
            scene.add(sun);

            // Create Earth with initial tilt
            const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
            const earthMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x4444ff,
                transparent: false,
                opacity: 1.0
            });
            earth = new THREE.Mesh(earthGeometry, earthMaterial);
            earth.position.set(15, 0, 0); // Start at summer solstice position
            earth.rotation.z = earthTilt; // Apply Earth's axial tilt
            scene.add(earth);

            // Create Dallas point
            const pointGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const pointMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            dallasPoint = new THREE.Mesh(pointGeometry, pointMaterial);
            updateDallasPosition();
            scene.add(dallasPoint);

            // Create Moon
            const moonGeometry = new THREE.SphereGeometry(0.27, 16, 16);
            const moonMaterial = new THREE.MeshLambertMaterial({ 
                color: 0xcccccc,
                transparent: true,
                opacity: 0.7
            });
            moon = new THREE.Mesh(moonGeometry, moonMaterial);
            moon.visible = moonVisible;
            updateMoonPosition();
            scene.add(moon);

            // Create trace line for Dallas
            traceGeometry = new THREE.BufferGeometry();
            const traceMaterial = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 2 });
            traceLine = new THREE.Line(traceGeometry, traceMaterial);
            scene.add(traceLine);

            // Create trace line for Moon
            moonTraceGeometry = new THREE.BufferGeometry();
            const moonTraceMaterial = new THREE.LineBasicMaterial({ 
                color: 0x0066ff, 
                linewidth: 2,
                transparent: true,
                opacity: 0.4
            });
            moonTraceLine = new THREE.Line(moonTraceGeometry, moonTraceMaterial);
            moonTraceLine.visible = moonVisible;
            scene.add(moonTraceLine);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.3);
            scene.add(ambientLight);
            
            const sunLight = new THREE.PointLight(0xffffff, 1, 100);
            sunLight.position.set(0, 0, 0);
            scene.add(sunLight);

            // Set initial camera position
            updateCameraPosition();

            // Add mouse controls for 3D rotation
            addMouseControls();

            // Start animation loop
            animate();
        } catch (error) {
            console.error('Initialization error:', error);
        }
    }

    function updateCameraPosition() {
        camera.position.x = cameraDistance * Math.sin(cameraRotation.y) * Math.cos(cameraRotation.x);
        camera.position.y = cameraDistance * Math.sin(cameraRotation.x);
        camera.position.z = cameraDistance * Math.cos(cameraRotation.y) * Math.cos(cameraRotation.x);
        camera.lookAt(0, 0, 0);
    }

    function addMouseControls() {
        const canvas = renderer.domElement;
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Mouse events
        canvas.addEventListener('mousedown', handleMouseDown);
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseup', handleMouseUp);
        canvas.addEventListener('mouseleave', handleMouseUp);
        canvas.addEventListener('wheel', handleWheel);

        // Touch events
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    }

    function handleMouseDown(event) {
        isDragging = true;
        previousMousePosition = { x: event.clientX, y: event.clientY };
    }

    function handleMouseMove(event) {
        if (!isDragging) return;
        const deltaMove = {
            x: event.clientX - previousMousePosition.x,
            y: event.clientY - previousMousePosition.y
        };
        cameraRotation.y += deltaMove.x * 0.01;
        cameraRotation.x += deltaMove.y * 0.01;
        cameraRotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, cameraRotation.x));
        updateCameraPosition();
        previousMousePosition = { x: event.clientX, y: event.clientY };
    }

    function handleMouseUp() {
        isDragging = false;
    }

    function handleWheel(event) {
        event.preventDefault();
        const zoomSpeed = 2;
        cameraDistance += (event.deltaY > 0 ? zoomSpeed : -zoomSpeed);
        cameraDistance = Math.max(5, Math.min(50, cameraDistance));
        document.getElementById('zoomControl').value = cameraDistance;
        updateCameraPosition();
    }

    function handleTouchStart(event) {
        event.preventDefault();
        touches = Array.from(event.touches);
        if (touches.length === 1) {
            isDragging = true;
            previousMousePosition = { x: touches[0].clientX, y: touches[0].clientY };
        } else if (touches.length === 2) {
            isDragging = false;
            const touch1 = touches[0];
            const touch2 = touches[1];
            lastTouchDistance = Math.sqrt(
                Math.pow(touch2.clientX - touch1.clientX, 2) +
                Math.pow(touch2.clientY - touch1.clientY, 2)
            );
        }
    }

    function handleTouchMove(event) {
        event.preventDefault();
        touches = Array.from(event.touches);
        if (touches.length === 1 && isDragging) {
            const deltaMove = {
                x: touches[0].clientX - previousMousePosition.x,
                y: touches[0].clientY - previousMousePosition.y
            };
            cameraRotation.y += deltaMove.x * 0.01;
            cameraRotation.x += deltaMove.y * 0.01;
            cameraRotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, cameraRotation.x));
            updateCameraPosition();
            previousMousePosition = { x: touches[0].clientX, y: touches[0].clientY };
        } else if (touches.length === 2) {
            const touch1 = touches[0];
            const touch2 = touches[1];
            const touchDistance = Math.sqrt(
                Math.pow(touch2.clientX - touch1.clientX, 2) +
                Math.pow(touch2.clientY - touch1.clientY, 2)
            );
            if (lastTouchDistance > 0) {
                const zoomSpeed = 0.05;
                const deltaDistance = touchDistance - lastTouchDistance;
                cameraDistance -= deltaDistance * zoomSpeed;
                cameraDistance = Math.max(5, Math.min(50, cameraDistance));
                document.getElementById('zoomControl').value = cameraDistance;
                updateCameraPosition();
            }
            lastTouchDistance = touchDistance;
        }
    }

    function handleTouchEnd(event) {
        event.preventDefault();
        touches = Array.from(event.touches);
        if (touches.length === 0) {
            isDragging = false;
            lastTouchDistance = 0;
        } else if (touches.length === 1) {
            isDragging = true;
            previousMousePosition = { x: touches[0].clientX, y: touches[0].clientY };
            lastTouchDistance = 0;
        }
    }

    function updateDallasPosition() {
        try {
            const earthRadius = 1;
            let x = earthRadius * Math.cos(dallasLat) * Math.cos(dallasLon + earthRotation);
            let y = earthRadius * Math.sin(dallasLat);
            let z = earthRadius * Math.cos(dallasLat) * Math.sin(dallasLon + earthRotation);
            
            const seasonalTilt = earthTilt * Math.cos(orbitalRotation);
            const yTilted = y * Math.cos(seasonalTilt) - z * Math.sin(seasonalTilt);
            const zTilted = y * Math.sin(seasonalTilt) + z * Math.cos(seasonalTilt);
            
            dallasPoint.position.set(
                earth.position.x + x,
                earth.position.y + yTilted,
                earth.position.z + zTilted
            );

            if (isAnimating && animationPhase >= 1) {
                tracePoints.push(new THREE.Vector3(
                    dallasPoint.position.x,
                    dallasPoint.position.y,
                    dallasPoint.position.z
                ));
                updateTraceLine();
            }
        } catch (error) {
            console.error('Error updating Dallas position:', error);
        }
    }

    function updateMoonPosition() {
        try {
            if (!moon || !earth) return;
            
            // Moon's orbit - astronomically accurate parameters
            const moonOrbitRadius = 3.84; // Scaled distance
            const moonOrbitalTilt = 5.1 * Math.PI / 180; // 5.1° inclination
            const moonOrbitSpeed = moonRotation;
            
            // Calculate Moon position in its orbital plane
            let moonX = moonOrbitRadius * Math.cos(moonOrbitSpeed);
            let moonY = moonOrbitRadius * Math.sin(moonOrbitalTilt) * Math.sin(moonOrbitSpeed);
            let moonZ = moonOrbitRadius * Math.cos(moonOrbitalTilt) * Math.sin(moonOrbitSpeed);
            
            // Apply Earth's axial tilt
            const seasonalTilt = earthTilt * Math.cos(orbitalRotation);
            const moonYTilted = moonY * Math.cos(seasonalTilt) - moonZ * Math.sin(seasonalTilt);
            const moonZTilted = moonY * Math.sin(seasonalTilt) + moonZ * Math.cos(seasonalTilt);
            
            moon.position.set(
                earth.position.x + moonX,
                earth.position.y + moonYTilted,
                earth.position.z + moonZTilted
            );

            if (isAnimating && animationPhase >= 1 && moonVisible) {
                moonTracePoints.push(new THREE.Vector3(
                    moon.position.x,
                    moon.position.y,
                    moon.position.z
                ));
                updateMoonTraceLine();
            }
        } catch (error) {
            console.error('Error updating Moon position:', error);
        }
    }

    function updateTraceLine() {
        try {
            if (tracePoints.length > 1) {
                traceGeometry.setFromPoints(tracePoints);
            }
        } catch (error) {
            console.error('Error updating trace line:', error);
        }
    }

    function updateMoonTraceLine() {
        try {
            if (moonTracePoints.length > 1 && moonVisible) {
                moonTraceGeometry.setFromPoints(moonTracePoints);
                moonTraceLine.visible = true;
            } else {
                moonTraceLine.visible = false;
            }
        } catch (error) {
            console.error('Error updating moon trace line:', error);
        }
    }

    function startAnimation() {
        if (!isAnimating) {
            isAnimating = true;
            animationPhase = 1;
            document.getElementById('phase').textContent = 'Earth Rotation';
        }
    }

    function resetAnimation() {
        isAnimating = false;
        animationPhase = 0;
        earthRotation = 0;
        orbitalRotation = 0;
        moonRotation = 0;
        tracePoints = [];
        moonTracePoints = [];
        
        earth.position.set(15, 0, 0);
        earth.rotation.z = earthTilt;
        earth.material.transparent = false;
        earth.material.opacity = 1.0;
        earthTransparent = false;
        moonVisible = true;
        moon.visible = moonVisible;
        moonTraceLine.visible = moonVisible;
        
        cameraRotation = { x: 0.35, y: 0 };
        cameraDistance = 22;
        document.getElementById('zoomControl').value = cameraDistance;
        updateCameraPosition();
        
        updateDallasPosition();
        updateMoonPosition();
        updateTraceLine();
        updateMoonTraceLine();
        updateInfo();
        
        document.getElementById('phase').textContent = 'Initial View';
    }

    function toggleTransparency() {
        earthTransparent = !earthTransparent;
        earth.material.transparent = earthTransparent;
        earth.material.opacity = earthTransparent ? 0.3 : 1.0;
    }

    function toggleSun() {
        sunVisible = !sunVisible;
        sun.visible = sunVisible;
    }

    function toggleMoon() {
        moonVisible = !moonVisible;
        moon.visible = moonVisible;
        moonTraceLine.visible = moonVisible;
    }

    function toggleControls() {
        controlsVisible = !controlsVisible;
        const controls = document.getElementById('controls');
        const hideButton = document.getElementById('hideToggle');
        
        if (controlsVisible) {
            controls.classList.remove('hidden');
            hideButton.textContent = 'Hide Controls';
        } else {
            controls.classList.add('hidden');
            hideButton.textContent = 'Show Controls';
        }
    }

    function updateSpeed() {
        animationSpeed = parseFloat(document.getElementById('speedControl').value);
    }

    function updateZoom() {
        cameraDistance = parseFloat(document.getElementById('zoomControl').value);
        updateCameraPosition();
    }

    function updateYear() {
        selectedYear = parseInt(document.getElementById('yearInput').value);
        if (isAnimating) {
            resetAnimation();
        }
    }

    function updateInfo() {
        try {
            document.getElementById('rotation').textContent = Math.round(earthRotation * 180 / Math.PI) + '°';
            
            const orbitalDegrees = orbitalRotation * 180 / Math.PI;
            let season = 'Summer Solstice';
            if (orbitalDegrees > 45 && orbitalDegrees <= 135) season = 'Fall Equinox';
            else if (orbitalDegrees > 135 && orbitalDegrees <= 225) season = 'Winter Solstice';
            else if (orbitalDegrees > 225 && orbitalDegrees <= 315) season = 'Spring Equinox';
            
            document.getElementById('orbital').textContent = season + ' (' + Math.round(orbitalDegrees) + '°)';
        } catch (error) {
            console.error('Error updating info:', error);
        }
    }

    function animate() {
        try {
            requestAnimationFrame(animate);

            if (isAnimating) {
                const rotationSpeed = 0.05 * animationSpeed;
                const orbitalSpeed = rotationSpeed / 365.25;
                const moonSpeed = rotationSpeed * 13.37;

                if (animationPhase === 1) {
                    earthRotation += rotationSpeed;
                    moonRotation += moonSpeed;
                    updateDallasPosition();
                    updateMoonPosition();
                    
                    if (earthRotation >= 2 * Math.PI) {
                        animationPhase = 2;
                        earth.material.transparent = true;
                        earth.material.opacity = 0.3;
                        earthTransparent = true;
                        document.getElementById('phase').textContent = 'Orbital Trace';
                    }
                } else if (animationPhase === 2) {
                    earthRotation += rotationSpeed;
                    orbitalRotation += orbitalSpeed;
                    moonRotation += moonSpeed;
                    
                    const orbitRadius = 15;
                    earth.position.x = orbitRadius * Math.cos(orbitalRotation);
                    earth.position.z = orbitRadius * Math.sin(orbitalRotation);
                    earth.rotation.z = earthTilt * Math.cos(orbitalRotation);
                    
                    updateDallasPosition();
                    updateMoonPosition();
                    
                    if (orbitalRotation >= 2 * Math.PI) {
                        isAnimating = false;
                        document.getElementById('phase').textContent = 'Complete';
                    }
                }
            }

            updateInfo();
            renderer.render(scene, camera);
        } catch (error) {
            console.error('Animation error:', error);
        }
    }

    // Handle window resize
    window.addEventListener('resize', function() {
        try {
            const container = document.getElementById('container');
            const containerRect = container.getBoundingClientRect();
            
            camera.aspect = containerRect.width / containerRect.height;
            camera.updateProjectionMatrix();
            renderer.setSize(containerRect.width, containerRect.height, false);
            renderer.domElement.style.width = '100%';
            renderer.domElement.style.height = '100%';
        } catch (error) {
            console.error('Resize error:', error);
        }
    });

    // Initialize when page loads
    window.addEventListener('load', function() {
        init();
    });
</script>
